name: Docker Image CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  IMAGE_TAG: hmt1/ecommerce-api:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: 'Create env file'
        env:
          ECOM_ENV_PRODUCTION: ${{ secrets.ECOM_ENV_PRODUCTION }}
        run: printf '%s\n' "$ECOM_ENV_PRODUCTION" > .env.production
      - name: Build the Docker image
        run: docker build --progress=plain -t "$IMAGE_TAG" .
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: printf '%s' "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Push the Docker image
        run: docker push "$IMAGE_TAG"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USERNAME }}
          password: ${{ secrets.HOST_PASSWORD }}
          port: ${{ secrets.PORT }}
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_PASSWORD
          script: |
            echo "Deploying $IMAGE_TAG to production"
            printf '%s' "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            docker pull "$IMAGE_TAG"
            if docker ps -aq --filter "name=^/ecom-api-prod$" | grep -q .; then
              docker rm -f ecom-api-prod
            else
              echo "Container ecom-api-prod does not exist, skipping removal"
            fi
            docker run -dp 3000:3000 --name ecom-api-prod --restart unless-stopped "$IMAGE_TAG"
